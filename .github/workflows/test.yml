name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-evdev python3-gi python3-pytest
      - run: pipx run ruff check .
      # The tests create uinput devices, so they need the module and root access to /dev/uinput.
      - run: sudo modprobe uinput
      - run: sudo python3 -m pytest -q -p no:cacheprovider
